name: Collect Warframe Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'

jobs:
  collect-primes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        # Warframes to collect data from the Warframe Market website. Add or remove Warframes as needed.
        warframe: [ash, atlas, banshee, baruuk, caliban, chroma, ember, equinox, excalibur, frost, gara, garuda, gauss, grendel, gyre, harrow, hildryn, hydroid, inaros, ivara, khora, lavos, limbo, loki, mag, mesa, mirage, nekros, nezha, nidus, nova, nyx, oberon, octavia, protea, revenant, rhino, saryn, sevagoth, styanax, titania, trinity, valkyr, vauban, volt, voruna, wisp, wukong, xaku, yareli, zephyr]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-py313-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Show cache state
        run: |
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
          python -m pip --version
          if [ -d "$HOME/.cache/ms-playwright" ]; then
            echo "Playwright cache directory exists"
            ls "$HOME/.cache/ms-playwright" | head
          else
            echo "Playwright cache directory missing"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Run data collection for ${{ matrix.warframe }}
        run: python extract-wfm.py ${{ matrix.warframe }}

              
      - name: Upload Warframe Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wf-data-${{ matrix.warframe }}
          path: result_${{ matrix.warframe }}.json
          retention-days: 1

  discord-notify:
    needs: collect-primes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install Requests
        run: pip install requests

      - name: Download all Warframe Data
        uses: actions/download-artifact@v4
        with:
          pattern: wf-data-*
          merge-multiple: true
          path: .

      - name: Run Aggregation and Notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py